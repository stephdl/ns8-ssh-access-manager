name: "Test module on QEMU"

# Boots a throwaway NS8 node on the runner and runs tests/ against it, so the
# module is tested without any external infrastructure. Chained on the build:
# a broken image never reaches the test. The wrapper lives in
# stephdl/ns8-ci-actions and mirrors the DigitalOcean one of ns8-github-actions.

run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Open a tmate shell when the suite fails"
        required: false
        default: false
        type: boolean
      ui_tests:
        description: "Run the cases tagged ui and publish their screenshots"
        required: false
        default: false
        type: boolean

jobs:
  run:
    name: "Run tests"
    # The screenshots are published as a comment, and a called workflow cannot
    # hold more than its caller. Granted here rather than by raising the
    # repository default, so the write token stops at this job.
    permissions:
      contents: read
      pull-requests: write
    uses: stephdl/ns8-ci-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      # build-images.sh publishes as sam, not as the name module-info
      # derives from the repository, so the name is spelled out here.
      image_name: sam
      # update tested separately later, independent of this drop-in
      # scenarios: '["install","update"]'
      ui_tests_strategy: ${{ github.event.inputs.ui_tests == 'true' && 'always' || 'on_renovate_ui_change' }}
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
